<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manufacturer artwork</title><style>
:root{color-scheme:dark}body{margin:32px;background:#121c20;color:#d7e8df;font:13px/1.5 system-ui}h1{font-size:22px;font-weight:500}table{width:100%;max-width:1000px;border-collapse:collapse}th,td{text-align:center;padding:18px;border-bottom:1px solid #30413e}th:first-child{text-align:left}td{width:28%}img{max-width:150px;width:100%;height:64px;object-fit:contain}.mono{filter:brightness(0) invert(1)}a{display:block;color:#8fa99b;font-size:10px;margin-top:8px}.missing{color:#748b80}@media(max-width:600px){body{margin:12px}th,td{padding:12px 5px}img{height:44px}}
</style><h1>Manufacturer artwork</h1><p>Original artwork. Missing variants are left empty.</p><table><thead><tr><th>Manufacturer</th><th>Monochrome</th><th>Color</th><th>Wordmark</th></tr></thead><tbody></tbody></table><script>
fetch('variants.json').then(r=>r.json()).then(data=>{for(const [code,variants] of Object.entries(data)){const row=document.createElement('tr');const name=document.createElement('th');name.textContent=code;row.append(name);for(const kind of ['mono','color','wordmark']){const cell=document.createElement('td'),art=variants[kind];if(art){const img=document.createElement('img');img.src=art.file;img.alt=code+' '+kind;if(kind==='mono'||art.monochrome)img.className='mono';const a=document.createElement('a');a.href=art.source;a.textContent='Source';a.rel='noopener';cell.append(img,a)}else{cell.className='missing';cell.textContent='Not found'}row.append(cell)}document.querySelector('tbody').append(row)}});
</script></html>
